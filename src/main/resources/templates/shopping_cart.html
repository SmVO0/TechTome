<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart – TechTome</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>

<header>
    <div class="navbar">
        <a th:href="@{/home}"><img src="/images/header/Logo.png" alt="TechTome" class="logo"></a>
        <form class="search-box" th:action="@{/search}" method="get">
            <input type="text" name="q" class="search-bar" placeholder="Search TechTome...">
            <button type="submit" class="search-btn">
                <img src="/images/header/search.png" alt="Search" class="search-icon">
            </button>
        </form>
        <div class="icons">
            <a th:href="@{/shopping}" aria-label="Shopping cart" sec:authorize="isAuthenticated()">
                <img src="/images/header/shopping_cart.png" alt="Cart" class="nav-icon">
            </a>
            <a th:href="@{/users/profile}" aria-label="Profile" sec:authorize="isAuthenticated()">
                <img src="/images/header/Profile.png" alt="Profile" class="nav-icon">
            </a>
            <a th:href="@{/login}" sec:authorize="!isAuthenticated()" class="nav-login-link">Log In</a>
        </div>
    </div>
</header>

<div class="main-container">

    <aside class="sidebar" aria-label="Category navigation">
        <nav class="menu" aria-label="Category navigation">
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/category/computers}">Computers</a>
            <a th:href="@{/category/laptops}">Laptops</a>
            <a th:href="@{/category/keyboards}">Keyboards</a>
            <a th:href="@{/category/mice}">Mice</a>
            <a th:href="@{/category/monitors}">Monitors</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="cart-layout">

            <!-- Cart items -->
            <section class="cart-items">
                <h2>Shopping Cart</h2>

                <!-- Empty state -->
                <div th:if="${#lists.isEmpty(items)}" class="cart-empty">
                    <p>Your cart is empty.</p>
                    <a th:href="@{/home}" class="btn-continue">Continue Shopping</a>
                </div>

                <!-- Cart table -->
                <div th:unless="${#lists.isEmpty(items)}">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th colspan="2">Item</th>
                                <th>Unit Price</th>
                                <th>Quantity</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cartItem : ${items}" th:data-item-id="${cartItem.storeItem.id}">
                                <td class="cart-item-img-cell">
                                    <img th:src="${cartItem.storeItem.image}"
                                         th:alt="${cartItem.storeItem.name}"
                                         class="cart-item-img">
                                </td>
                                <td class="cart-item-name" th:text="${cartItem.storeItem.name}"></td>
                                <td th:text="'€' + ${#numbers.formatDecimal(cartItem.unitPrice, 1, 'NONE', 2, 'POINT')}"></td>
                                <td>
                                    <div class="cart-qty-controls">
                                        <form th:action="@{/shopping/remove}" method="post">
                                            <input type="hidden" name="itemId" th:value="${cartItem.storeItem.id}">
                                            <button type="submit" class="cart-qty-btn" aria-label="Decrease quantity">−</button>
                                        </form>
                                        <span class="cart-qty-value" th:text="${cartItem.quantity}"></span>
                                        <form th:action="@{/shopping/add}" method="post">
                                            <input type="hidden" name="itemId" th:value="${cartItem.storeItem.id}">
                                            <button type="submit" class="cart-qty-btn" aria-label="Increase quantity">+</button>
                                        </form>
                                    </div>
                                </td>
                                <td class="cart-item-subtotal" th:text="'€' + ${#numbers.formatDecimal(cartItem.unitPrice * cartItem.quantity, 1, 'NONE', 2, 'POINT')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Order summary -->
            <aside class="cart-summary" aria-label="Order summary" th:unless="${#lists.isEmpty(items)}">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span class="cart-subtotal-value" th:text="'€' + ${#numbers.formatDecimal(totalPrice, 1, 'NONE', 2, 'POINT')}"></span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span class="summary-free">FREE</span>
                </div>
                <hr class="summary-divider">
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span class="cart-total-value" th:text="'€' + ${#numbers.formatDecimal(totalPrice, 1, 'NONE', 2, 'POINT')}"></span>
                </div>
                <a th:href="@{/checkout/payment}" class="btn-checkout">Proceed to Checkout</a>
                <a th:href="@{/home}" class="btn-continue">Continue Shopping</a>
            </aside>

        </div>
    </main>

</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>

<script src="/js/cart-qty.js"></script>
</body>
</html>
