<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Info – TechTome</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>

<header>
    <div class="navbar">
        <a th:href="@{/home}"><img src="/images/header/Logo.png" alt="TechTome" class="logo"></a>
        <form class="search-box" th:action="@{/search}" method="get">
            <input type="text" name="q" class="search-bar" placeholder="Search TechTome...">
            <button type="submit" class="search-btn">
                <img src="/images/header/search.png" alt="Search" class="search-icon">
            </button>
        </form>
        <div class="icons">
            <a th:href="@{/shopping}" aria-label="Shopping cart">
                <img src="/images/header/shopping_cart.png" alt="Cart" class="nav-icon">
            </a>
            <a th:href="@{/users/profile}" aria-label="Profile">
                <img src="/images/header/Profile.png" alt="Profile" class="nav-icon">
            </a>
        </div>
    </div>
</header>

<div class="main-container">

    <aside class="sidebar">
        <nav class="menu" aria-label="Category navigation">
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/category/computers}">Computers</a>
            <a th:href="@{/category/laptops}">Laptops</a>
            <a th:href="@{/category/keyboards}">Keyboards</a>
            <a th:href="@{/category/mice}">Mice</a>
            <a th:href="@{/category/monitors}">Monitors</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="profile">

            <div class="profile-name">
                <h1>Personal Information</h1>
            </div>

            <div class="info-grid">
                <div class="info-row">
                    <span class="info-label">Username</span>
                    <span class="info-value" th:text="${user.username}">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Email</span>
                    <span class="info-value" th:text="${user.email}">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">First Name</span>
                    <span class="info-value"
                          th:text="${user.firstName != null ? user.firstName : '—'}">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Last Name</span>
                    <span class="info-value"
                          th:text="${user.lastName != null ? user.lastName : '—'}">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Role</span>
                    <span class="info-value" th:text="${user.role.name()}">USER</span>
                </div>
            </div>

            <a th:href="@{/users/profile}" class="btn-continue" style="margin-top: 16px; display:inline-block;">
                Back to Profile
            </a>

        </div>
    </main>

</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>

</body>
</html>
