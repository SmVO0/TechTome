<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error – TechTome</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>

<main class="page-content">
    <div class="auth-card" style="text-align: center; max-width: 480px;">
        <h1 class="error-code" th:text="${statusCode}">500</h1>
        <p class="error-message" th:text="${message}">Something went wrong.</p>
        <a th:href="@{/home}" class="btn-hero-primary" style="display:inline-block; margin-top: 20px;">
            Go Home
        </a>
    </div>
</main>

<footer th:insert="fragments/footer :: footer"></footer>

</body>
</html>
