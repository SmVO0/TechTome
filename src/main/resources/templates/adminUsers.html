<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – Users – TechTome</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<header>
    <div class="navbar">
        <a th:href="@{/home}"><img src="/images/header/Logo.png" alt="TechTome" class="logo"></a>
        <form class="search-box" th:action="@{/search}" method="get">
            <input type="text" name="q" class="search-bar" placeholder="Search TechTome...">
            <button type="submit" class="search-btn">
                <img src="/images/header/search.png" alt="Search" class="search-icon">
            </button>
        </form>
        <div class="icons">
            <a th:href="@{/shopping}" aria-label="Shopping cart">
                <img src="/images/header/shopping_cart.png" alt="Cart" class="nav-icon">
            </a>
            <a th:href="@{/users/profile}" aria-label="Profile">
                <img src="/images/header/Profile.png" alt="Profile" class="nav-icon">
            </a>
        </div>
    </div>
</header>

<div th:insert="~{fragments/adminNav :: adminNav}"></div>

<div class="main-container">
    <main class="main-content" style="grid-column: 1 / -1;">
        <div class="admin-panel">

            <h2 class="admin-title">User Management</h2>

            <form th:action="@{/admin/users}" method="get" class="admin-search-form">
                <input type="text" name="q" class="admin-search-input"
                       placeholder="Search by username or email…"
                       th:value="${query}">
                <button type="submit" class="admin-btn">Search</button>
                <a th:href="@{/admin/users}" class="admin-btn-secondary"
                   th:if="${query != null and !#strings.isEmpty(query)}">Clear</a>
            </form>

            <p class="admin-result-count"
               th:text="${users.totalElements} + ' user' + (${users.totalElements} != 1 ? 's' : '')"></p>

            <div th:if="${users.isEmpty()}" class="cart-empty">
                <p>No users found.</p>
            </div>

            <div th:unless="${users.isEmpty()}">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Subscription</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}"
                            class="admin-table-row-link"
                            th:onclick="|window.location='@{/admin/users/{id}(id=${u.id})}'|">
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.email}"></td>
                            <td>
                                <span class="role-badge"
                                      th:classappend="'role-' + ${u.role.name().toLowerCase()}"
                                      th:text="${u.role.name()}"></span>
                            </td>
                            <td>
                                <span th:if="${!u.subscriptions.isEmpty()}"
                                      class="sub-badge"
                                      th:classappend="'sub-' + ${u.subscriptions[0].type.name().toLowerCase()}"
                                      th:text="${u.subscriptions[0].type.name()}"></span>
                                <span th:if="${u.subscriptions.isEmpty()}" style="color:#94a3b8">—</span>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <nav class="admin-pagination" th:if="${users.totalPages > 1}" aria-label="Pagination">
                    <a th:href="@{/admin/users(q=${query}, page=${users.number - 1})}"
                       th:classappend="${users.first} ? ' disabled'"
                       th:aria-disabled="${users.first}">‹ Prev</a>
                    <th:block th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
                        <span th:if="${i == users.number}" class="current" th:text="${i + 1}"></span>
                        <a th:unless="${i == users.number}"
                           th:href="@{/admin/users(q=${query}, page=${i})}"
                           th:text="${i + 1}"></a>
                    </th:block>
                    <a th:href="@{/admin/users(q=${query}, page=${users.number + 1})}"
                       th:classappend="${users.last} ? ' disabled'"
                       th:aria-disabled="${users.last}">Next ›</a>
                </nav>
            </div>

        </div>
    </main>
</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>

</body>
</html>
