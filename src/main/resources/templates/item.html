<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${item.name} + ' – TechTome'">Item – TechTome</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/item.css">
</head>
<body>

<header>
    <div class="navbar">
        <a th:href="@{/}"><img src="/images/header/Logo.png" alt="TechTome" class="logo"></a>
        <form class="search-box" th:action="@{/search}" method="get">
            <input type="text" name="q" class="search-bar" placeholder="Search TechTome...">
            <button type="submit" class="search-btn">
                <img src="/images/header/search.png" alt="Search" class="search-icon">
            </button>
        </form>
        <div class="icons">
            <a th:href="@{/shopping}" aria-label="Shopping cart">
                <img src="/images/header/shopping_cart.png" alt="Cart" class="nav-icon">
            </a>
            <a th:href="@{/users/profile}" aria-label="Profile">
                <img src="/images/header/Profile.png" alt="Profile" class="nav-icon">
            </a>
        </div>
    </div>
</header>

<div class="main-container">

    <aside class="sidebar">
        <nav class="menu">
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/category/computers}">Computers</a>
            <a th:href="@{/category/laptops}">Laptops</a>
            <a th:href="@{/category/keyboards}">Keyboards</a>
            <a th:href="@{/category/mice}">Mice</a>
            <a th:href="@{/category/monitors}">Monitors</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="item-detail">

            <div class="item-detail-image-wrap">
                <img th:src="${item.image}" th:alt="${item.name}" class="item-detail-image">
            </div>

            <div class="item-detail-content">

                <p class="item-detail-category" th:text="${item.category.name}">Category</p>
                <h1 class="item-detail-title" th:text="${item.name}">Item Name</h1>

                <p class="item-detail-price" th:text="'€' + ${#numbers.formatDecimal(item.price, 1, 'NONE', 2, 'POINT')}">€0.00</p>

                <p class="item-detail-stock in-stock" th:if="${item.stock > 0}"
                   th:text="${item.stock} + ' in stock'">In Stock</p>
                <p class="item-detail-stock out-of-stock" th:unless="${item.stock > 0}">Out of Stock</p>

                <p class="item-detail-desc" th:text="${item.description}">Description</p>

                <form th:action="@{/shopping/add}" method="post" th:if="${item.stock > 0}"
                      th:attr="data-item-name=${item.name}">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <button type="submit" class="btn-add-to-cart">Add to Cart</button>
                </form>
                <button type="button" class="btn-add-to-cart disabled" disabled th:unless="${item.stock > 0}">
                    Out of Stock
                </button>

                <a th:href="@{'/category/' + ${item.category.name.toLowerCase()}}"
                   class="item-detail-back">← Back to [[${item.category.name}]]</a>

            </div>

        </div>
    </main>

</div>

<footer th:insert="fragments/footer :: footer"></footer>

<script src="/js/cart.js"></script>
</body>
</html>
