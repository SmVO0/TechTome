<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${#strings.capitalize(category.name)} + ' – TechTome'">Category – TechTome</title>
    <meta name="description" th:content="'Browse our selection of ' + ${category.name} + ' at TechTome.'">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${#strings.capitalize(category.name)} + ' – TechTome'">
    <meta property="og:description" th:content="'Browse our selection of ' + ${category.name} + ' at TechTome.'">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/category.css">
</head>
<body>

<header>
    <div class="navbar">
        <a th:href="@{/home}"><img src="/images/header/Logo.png" alt="TechTome" class="logo"></a>
        <form class="search-box" th:action="@{/search}" method="get">
            <input type="text" name="q" class="search-bar" placeholder="Search TechTome...">
            <button type="submit" class="search-btn">
                <img src="/images/header/search.png" alt="Search" class="search-icon">
            </button>
        </form>
        <div class="icons">
            <a th:href="@{/shopping}" aria-label="Shopping cart" sec:authorize="isAuthenticated()">
                <img src="/images/header/shopping_cart.png" alt="Cart" class="nav-icon">
            </a>
            <a th:href="@{/users/profile}" aria-label="Profile" sec:authorize="isAuthenticated()">
                <img src="/images/header/Profile.png" alt="Profile" class="nav-icon">
            </a>
            <a th:href="@{/login}" sec:authorize="!isAuthenticated()" class="nav-login-link">Log In</a>
        </div>
    </div>
</header>

<div class="main-container">

    <aside class="sidebar">
        <nav class="menu" aria-label="Category navigation">
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/category/computers}">Computers</a>
            <a th:href="@{/category/laptops}">Laptops</a>
            <a th:href="@{/category/keyboards}">Keyboards</a>
            <a th:href="@{/category/mice}">Mice</a>
            <a th:href="@{/category/monitors}">Monitors</a>
        </nav>
    </aside>

    <main class="main-content">

        <div class="search-header">
            <h2 th:text="${#strings.capitalize(category.name)}"></h2>
            <span class="search-count" th:text="'(' + ${items.totalElements} + ')'"></span>
        </div>

        <div th:if="${items.totalElements == 0}" class="search-empty">
            <p>No products in this category yet.</p>
        </div>

        <div th:unless="${items.totalElements == 0}" class="items-container">
            <div class="item" th:each="item : ${items.content}">
                <a th:href="@{'/item/' + ${item.id}}">
                    <img th:src="${item.image}" alt="Item" class="item-image">
                    <p th:text="${item.name}">Item name</p>
                </a>
                <hr>
                <div class="bottom-item">
                    <div class="price-container">
                        <p>Price</p>
                        <p th:text="'€' + ${#numbers.formatDecimal(item.price, 1, 'NONE', 2, 'POINT')}"></p>
                    </div>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <form th:action="@{/shopping/add}" method="post"
                              th:attr="data-item-name=${item.name}">
                            <input type="hidden" name="itemId" th:value="${item.id}">
                            <button type="submit">Add to Cart</button>
                        </form>
                        <form sec:authorize="isAuthenticated()"
                              th:action="@{/wishlist/toggle}" method="post">
                            <input type="hidden" name="itemId" th:value="${item.id}">
                            <input type="hidden" name="redirectUrl"
                                   th:value="@{'/category/' + ${category.name}}">
                            <button type="submit" class="btn-wishlist-heart"
                                    th:title="${wishlistedIds.contains(item.id)} ? 'Remove from wishlist' : 'Add to wishlist'"
                                    th:text="${wishlistedIds.contains(item.id)} ? '♥' : '♡'"></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <nav th:if="${items.totalPages > 1}" class="pagination" aria-label="Category pages">
            <a th:if="${currentPage > 0}"
               th:href="@{/category/{name}(name=${category.name}, page=${currentPage - 1})}"
               class="page-link">&laquo; Previous</a>

            <span th:each="i : ${#numbers.sequence(0, items.totalPages - 1)}">
                <a th:href="@{/category/{name}(name=${category.name}, page=${i})}"
                   th:text="${i + 1}"
                   th:classappend="${i == currentPage} ? 'page-link page-active' : 'page-link'"></a>
            </span>

            <a th:if="${currentPage < items.totalPages - 1}"
               th:href="@{/category/{name}(name=${category.name}, page=${currentPage + 1})}"
               class="page-link">Next &raquo;</a>
        </nav>

    </main>

</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>

<script src="/js/cart.js"></script>
</body>
</html>
