<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search – TechTome</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/category.css">
</head>
<body>

<header>
    <div class="navbar">
        <a th:href="@{/home}"><img src="/images/header/Logo.png" alt="TechTome" class="logo"></a>
        <form class="search-box" th:action="@{/search}" method="get">
            <input type="text" name="q" class="search-bar" placeholder="Search TechTome..."
                   th:value="${query}">
            <button type="submit" class="search-btn">
                <img src="/images/header/search.png" alt="Search" class="search-icon">
            </button>
        </form>
        <div class="icons">
            <a th:href="@{/shopping}" aria-label="Shopping cart" sec:authorize="isAuthenticated()">
                <img src="/images/header/shopping_cart.png" alt="Cart" class="nav-icon">
            </a>
            <a th:href="@{/users/profile}" aria-label="Profile" sec:authorize="isAuthenticated()">
                <img src="/images/header/Profile.png" alt="Profile" class="nav-icon">
            </a>
            <a th:href="@{/login}" sec:authorize="!isAuthenticated()" class="nav-login-link">Log In</a>
        </div>
    </div>
</header>

<div class="main-container">

    <aside class="sidebar">
        <nav class="menu" aria-label="Category navigation">
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/category/computers}">Computers</a>
            <a th:href="@{/category/laptops}">Laptops</a>
            <a th:href="@{/category/keyboards}">Keyboards</a>
            <a th:href="@{/category/mice}">Mice</a>
            <a th:href="@{/category/monitors}">Monitors</a>
        </nav>
    </aside>

    <main class="main-content">

        <div class="search-header">
            <h2 th:if="${query != null and !#strings.isEmpty(query)}">
                Results for "<span th:text="${query}"></span>"
                <span class="search-count" th:text="'(' + ${results.totalElements} + ')'"></span>
            </h2>
            <h2 th:unless="${query != null and !#strings.isEmpty(query)}">All Products</h2>
        </div>

        <!-- Empty state -->
        <div th:if="${results.totalElements == 0}" class="search-empty">
            <p>No products found for "<span th:text="${query}"></span>".</p>
            <a th:href="@{/home}" class="btn-continue">Browse all products</a>
        </div>

        <!-- Results grid -->
        <div th:unless="${results.totalElements == 0}" class="items-container">
            <div class="item" th:each="item : ${results.content}">
                <a th:href="@{'/item/' + ${item.id}}">
                    <img th:src="${item.image}" th:alt="${item.name}" class="item-image">
                    <p th:text="${item.name}">Item name</p>
                </a>
                <hr>
                <div class="bottom-item">
                    <div class="price-container">
                        <p>Price</p>
                        <p th:text="'€' + ${#numbers.formatDecimal(item.price, 1, 'NONE', 2, 'POINT')}"></p>
                    </div>
                    <form th:action="@{/shopping/add}" method="post"
                          th:attr="data-item-name=${item.name}">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <button type="submit">Add to Cart</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${results.totalPages > 1}" class="pagination" aria-label="Search results pages">
            <a th:if="${currentPage > 0}"
               th:href="@{/search(q=${query}, page=${currentPage - 1})}"
               class="page-link">&laquo; Previous</a>

            <span th:each="i : ${#numbers.sequence(0, results.totalPages - 1)}">
                <a th:href="@{/search(q=${query}, page=${i})}"
                   th:text="${i + 1}"
                   th:classappend="${i == currentPage} ? 'page-link page-active' : 'page-link'"></a>
            </span>

            <a th:if="${currentPage < results.totalPages - 1}"
               th:href="@{/search(q=${query}, page=${currentPage + 1})}"
               class="page-link">Next &raquo;</a>
        </nav>

    </main>

</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>

<script src="/js/cart.js"></script>
</body>
</html>
