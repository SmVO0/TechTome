spring.application.name=TechTome

# MVC configuration
spring.mvc.hiddenmethod.filter.enabled=true

# Base configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tech_tome_app?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678
logging.level.org.hibernate.persister.entity=ERROR
logging.level.com.SVO.TechTome.services.EcontDeliveryService=DEBUG

spring.security.user.name=${DB-USER}
spring.security.user.password=${DB-PASS}


spring.thymeleaf.cache=false

# Econt delivery integration
# Test environment: demo.econt.com credentials are publicly documented for dev use.
# Override ECONT_USER, ECONT_PASS, and ECONT_URL environment variables for production.
econt.api-url=${ECONT_URL:http://demo.econt.com/ee/services}
econt.username=${ECONT_USER:iasp-dev}
econt.password=${ECONT_PASS:1Asp-dev}
econt.sender.name=TechTome
econt.sender.phone=+35929000000
econt.sender.city=\u0421\u043e\u0444\u0438\u044f
econt.sender.post-code=1000
econt.sender.street=\u0431\u0443\u043b. \u0412\u0438\u0442\u043e\u0448\u0430
econt.sender.num=1